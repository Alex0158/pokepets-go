<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mission prototype</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
  <header><p class="eyebrow">Pokepet Go · Local prototype</p><h1>Little adventures</h1><p>Choose an activity to enjoy with your pet.</p><p class="note">Sample activities and local session only. Refresh resets progress.</p></header>
  <section aria-label="Missions"><h2>Choose an activity</h2><div id="missions" class="missions"></div></section>
  <section aria-label="Selected mission"><div id="details" class="panel"></div></section>
  <section aria-label="Pet upgrades"><h2>Grow together</h2><p>Adventure points: <strong id="points">0</strong></p><div id="stats" class="stats"></div><p class="note">Each upgrade costs 5 points. Stats are fictional game attributes.</p></section>
  <p id="message" aria-live="polite"></p>
</main><script type="module" src="./ui.mjs"></script>
</body></html>
